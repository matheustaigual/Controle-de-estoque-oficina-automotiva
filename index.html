<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<title>Oficina Pro | Loja e Controle de Estoque</title>

<style>
:root{
  --bg:#0f1115; --panel:#181b22; --panel2:#1f232c; --line:#2b303b;
  --text:#eceef2; --muted:#9097a5; --accent:#ff7a1a; --accent2:#ffa24d;
  --ok:#2ecc71; --warn:#f5b301; --bad:#ef4b4b; --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}
h1,h2,h3,.brand{font-family:'Barlow Condensed',Inter,sans-serif;letter-spacing:.02em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent2)}
.hidden{display:none!important}

/* header */
header{position:sticky;top:0;z-index:20;background:rgba(15,17,21,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1200px;margin:auto;display:flex;align-items:center;gap:16px;padding:12px 20px}
.brand{font-size:26px;font-weight:700;color:var(--text);text-decoration:none;display:flex;align-items:center;gap:8px;text-transform:uppercase}
.brand b{color:var(--accent)}
nav{display:flex;gap:4px;margin-left:auto;align-items:center}
nav a,nav button{background:none;border:0;padding:8px 14px;border-radius:8px;color:var(--muted);text-decoration:none;cursor:pointer;font-weight:500}
nav a:hover,nav button:hover,nav a.on{color:var(--text);background:var(--panel2)}
.cartbtn{position:relative;background:var(--accent)!important;color:#111!important;font-weight:600}
.cartbtn .n{background:#111;color:var(--accent);border-radius:20px;padding:0 7px;margin-left:6px;font-size:12px}

main{max-width:1200px;margin:auto;padding:24px 20px 80px}

/* buttons / inputs */
.btn{background:var(--accent);color:#111;border:0;padding:10px 18px;border-radius:9px;font-weight:600;cursor:pointer;transition:.15s;display:inline-block}
.btn:hover{background:var(--accent2)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--panel2)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.danger:hover{background:var(--bad);color:#fff}
.btn.sm{padding:6px 11px;font-size:13px}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.field{margin-bottom:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

/* hero */
.hero{background:linear-gradient(120deg,#1c1f27 0%,#2a1c10 100%);border:1px solid var(--line);border-radius:18px;padding:36px;margin-bottom:24px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;border:34px solid rgba(255,122,26,.12)}
.hero h1{font-size:44px;line-height:1.05;text-transform:uppercase;max-width:620px}
.hero h1 span{color:var(--accent)}
.hero p{color:var(--muted);margin-top:10px;max-width:520px}

.tools{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.tools input{max-width:320px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--panel);border:1px solid var(--line);padding:6px 14px;border-radius:30px;cursor:pointer;font-size:14px;color:var(--muted)}
.chip.on,.chip:hover{border-color:var(--accent);color:var(--text)}
.chip.on{background:rgba(255,122,26,.14)}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;transition:.15s}
.card:hover{border-color:#444b59;transform:translateY(-2px)}
.thumb{aspect-ratio:4/3;background:var(--panel2);display:flex;align-items:center;justify-content:center;color:#3b4150}
.thumb img{width:100%;height:100%;object-fit:cover}
.card .body{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.cat{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent2)}
.card h3{font-size:20px;line-height:1.15;font-weight:600}
.sku{font-size:12px;color:var(--muted)}
.price{font-family:'Barlow Condensed';font-size:28px;font-weight:700;margin-top:auto}
.badge{display:inline-block;font-size:12px;padding:2px 9px;border-radius:20px;font-weight:500}
.b-ok{background:rgba(46,204,113,.14);color:var(--ok)}
.b-low{background:rgba(245,179,1,.14);color:var(--warn)}
.b-out{background:rgba(239,75,75,.14);color:var(--bad)}
.b-info{background:rgba(255,122,26,.14);color:var(--accent2)}
.b-mute{background:var(--panel2);color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:60px 20px;border:1px dashed var(--line);border-radius:var(--radius)}

/* drawer */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none}
.overlay.open{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:41;transform:translateX(100%);transition:.25s;display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer .head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.drawer .head h2{font-size:26px;text-transform:uppercase}
.drawer .items{flex:1;overflow:auto;padding:12px 20px}
.drawer .foot{padding:18px 20px;border-top:1px solid var(--line)}
.citem{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.citem .info{flex:1;min-width:0}
.citem .info b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.qty button{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);cursor:pointer}
.total{display:flex;justify-content:space-between;font-size:20px;margin-bottom:14px}

.btn.wpp{background:#25d366;color:#08210f}

.tabs button.on{color:var(--text);border-color:var(--accent)}

table{width:100%;border-collapse:collapse;font-size:14px}

footer{text-align:center;color:var(--muted);font-size:13px;padding:30px 0}

/* ============================================================
   SQL DE INSTALAÇÃO (rodar uma vez no SQL Editor do Supabase)
   ============================================================ */
const SETUP_SQL = `-- TABELAS
create table if not exists produtos (
  id uuid primary key default gen_random_uuid(),
  sku text unique,
  nome text not null,
  categoria text default 'Geral',
  descricao text,
  preco numeric(10,2) not null default 0,
  custo numeric(10,2) default 0,
  quantidade integer not null default 0 check (quantidade >= 0),
  estoque_minimo integer not null default 5,
  imagem_url text,
  ativo boolean not null default true,
  criado_em timestamptz default now()
);

create table if not exists movimentacoes (
  id uuid primary key default gen_random_uuid(),
  produto_id uuid references produtos(id) on delete cascade,
  tipo text not null check (tipo in ('entrada','saida','ajuste','venda')),
  quantidade integer not null,
  motivo text,
  criado_em timestamptz default now()
);

create table if not exists pedidos (
  id uuid primary key default gen_random_uuid(),
  numero serial,
  cliente_nome text not null,
  cliente_telefone text not null,
  observacao text,
  itens jsonb not null,
  total numeric(10,2) not null,
  status text not null default 'novo' check (status in ('novo','confirmado','entregue','cancelado')),
  criado_em timestamptz default now()
);

-- SEGURANÇA (RLS): público só lê produtos ativos; admin logado faz tudo
alter table produtos enable row level security;
alter table movimentacoes enable row level security;
alter table pedidos enable row level security;

drop policy if exists "publico le produtos ativos" on produtos;
create policy "publico le produtos ativos" on produtos for select using (ativo = true);
drop policy if exists "admin produtos" on produtos;
create policy "admin produtos" on produtos for all to authenticated using (true) with check (true);
drop policy if exists "admin movimentacoes" on movimentacoes;
create policy "admin movimentacoes" on movimentacoes for all to authenticated using (true) with check (true);
drop policy if exists "admin pedidos" on pedidos;
create policy "admin pedidos" on pedidos for all to authenticated using (true) with check (true);

-- FUNÇÃO: cliente cria pedido (valida estoque e baixa automaticamente)
create or replace function criar_pedido(p_nome text, p_tel text, p_obs text, p_itens jsonb)
returns integer language plpgsql security definer set search_path = public as $$
declare item jsonb; prod produtos%rowtype; v_total numeric := 0;
        v_itens jsonb := '[]'::jsonb; qtd int; num int;
begin
  if p_nome is null or length(trim(p_nome)) < 2 then raise exception 'Informe seu nome'; end if;
  if p_tel is null or length(trim(p_tel)) < 8 then raise exception 'Informe um telefone válido'; end if;
  if jsonb_array_length(p_itens) = 0 then raise exception 'Carrinho vazio'; end if;
  for item in select * from jsonb_array_elements(p_itens) loop
    qtd := (item->>'qtd')::int;
    if qtd <= 0 then raise exception 'Quantidade inválida'; end if;
    select * into prod from produtos where id = (item->>'id')::uuid and ativo for update;
    if not found then raise exception 'Produto indisponível'; end if;
    if prod.quantidade < qtd then raise exception 'Estoque insuficiente para %', prod.nome; end if;
    update produtos set quantidade = quantidade - qtd where id = prod.id;
    insert into movimentacoes(produto_id, tipo, quantidade, motivo)
      values (prod.id, 'venda', qtd, 'Pedido da loja online');
    v_total := v_total + prod.preco * qtd;
    v_itens := v_itens || jsonb_build_object('id', prod.id, 'nome', prod.nome,
               'sku', prod.sku, 'preco', prod.preco, 'qtd', qtd);
  end loop;
  insert into pedidos(cliente_nome, cliente_telefone, observacao, itens, total)
    values (trim(p_nome), trim(p_tel), p_obs, v_itens, v_total) returning numero into num;
  return num;
end $$;

-- FUNÇÃO: admin movimenta estoque (entrada, saída ou ajuste)
create or replace function movimentar_estoque(p_produto uuid, p_tipo text, p_qtd int, p_motivo text)
returns void language plpgsql security definer set search_path = public as $$
declare atual int; novo int;
begin
  if auth.uid() is null then raise exception 'Não autorizado'; end if;
  select quantidade into atual from produtos where id = p_produto for update;
  if not found then raise exception 'Produto não encontrado'; end if;
  if p_tipo = 'entrada' then novo := atual + p_qtd;
  elsif p_tipo = 'saida' then novo := atual - p_qtd;
  elsif p_tipo = 'ajuste' then novo := p_qtd;
  else raise exception 'Tipo inválido'; end if;
  if novo < 0 then raise exception 'O estoque não pode ficar negativo'; end if;
  update produtos set quantidade = novo where id = p_produto;
  insert into movimentacoes(produto_id, tipo, quantidade, motivo)
    values (p_produto, p_tipo, case when p_tipo = 'ajuste' then novo else p_qtd end, p_motivo);
end $$;

-- FUNÇÃO: admin cancela pedido e devolve itens ao estoque
create or replace function cancelar_pedido(p_id uuid)
returns void language plpgsql security definer set search_path = public as $$
declare ped pedidos%rowtype; item jsonb;
begin
  if auth.uid() is null then raise exception 'Não autorizado'; end if;
  select * into ped from pedidos where id = p_id for update;
  if not found then raise exception 'Pedido não encontrado'; end if;
  if ped.status = 'cancelado' then return; end if;
  for item in select * from jsonb_array_elements(ped.itens) loop
    update produtos set quantidade = quantidade + (item->>'qtd')::int where id = (item->>'id')::uuid;
    insert into movimentacoes(produto_id, tipo, quantidade, motivo)
      values ((item->>'id')::uuid, 'entrada', (item->>'qtd')::int, 'Cancelamento do pedido #' || ped.numero);
  end loop;
  update pedidos set status = 'cancelado' where id = p_id;
end $$;

grant execute on function criar_pedido(text,text,text,jsonb) to anon, authenticated;
grant execute on function movimentar_estoque(uuid,text,int,text) to authenticated;
grant execute on function cancelar_pedido(uuid) to authenticated;`;

/* ---- carrinho ---- */
function cartItems() {
  return state.cart.map(c => {
    const p = state.produtos.find(x => x.id === c.id);
    return p ? { ...p, qtd: c.qtd } : null;
  }).filter(Boolean);
}
function addCart(id) {
  const p = state.produtos.find(x => x.id === id); if (!p) return;
  const c = state.cart.find(x => x.id === id);
  if (c) {
    if (c.qtd >= p.quantidade) return toast('Quantidade máxima em estoque atingida', 'err');
    c.qtd++;
  } else state.cart.push({ id, qtd: 1 });
  saveCart(); toast('Adicionado ao carrinho', 'ok');
}
function changeQty(id, d) {
  const c = state.cart.find(x => x.id === id); const p = state.produtos.find(x => x.id === id);
  if (!c || !p) return;
  c.qtd += d;
  if (c.qtd > p.quantidade) { c.qtd = p.quantidade; toast('Limite de estoque', 'err'); }
  if (c.qtd <= 0) state.cart = state.cart.filter(x => x.id !== id);
  saveCart(); drawCart();
}
function drawCart() {
  const items = cartItems();
  const total = items.reduce((a, i) => a + i.preco * i.qtd, 0);
  $('#drawer').innerHTML = `
    <div class="head"><h2>Seu carrinho</h2><button class="btn ghost sm" data-a="closeCart">Fechar</button></div>
    <div class="items">${items.length ? items.map(i => `

        <div class="qty"><button data-a="dec" data-id="${i.id}">−</button><span>${i.qtd}</span><button data-a="inc" data-id="${i.id}">+</button></div>
      </div>`).join('') : '<div class="empty" style="margin-top:30px">Seu carrinho está vazio.</div>'}</div>
    <div class="foot">
      <div class="total"><span>Total</span><b>${brl(total)}</b></div>
      <button class="btn wpp" style="width:100%" data-a="checkout" ${items.length ? '' : 'disabled'}>Finalizar pelo WhatsApp</button>
    </div>`;
}
function openCart() { drawCart(); $('#drawer').classList.add('open'); $('#overlay').classList.add('open'); }
function closeCart() { $('#drawer').classList.remove('open'); $('#overlay').classList.remove('open'); }

  closeCart();

      <div class="row">
        <div class="field"><label>Código / SKU</label><input name="sku" value="${esc(p?.sku)}"></div>
        <div class="field"><label>Categoria</label><input name="categoria" list="cats" value="${esc(p?.categoria || '')}"><datalist id="cats">${cats.map(c => `<option value="${esc(c)}">`).join('')}</datalist></div>
      </div>
      <div class="field"><label>Descrição</label><textarea name="descricao" rows="2">${esc(p?.descricao)}</textarea></div>
      <div class="row3">
        <div class="field"><label>Custo (R$)</label><input type="number" step="0.01" min="0" name="custo" value="${p ? p.custo : 0}"></div>
        <div class="field"><label>Preço de venda (R$) *</label><input type="number" step="0.01" min="0" name="preco" required value="${p ? p.preco : ''}"></div>
        <div class="field"><label>Estoque mínimo</label><input type="number" min="0" name="estoque_minimo" value="${p ? p.estoque_minimo : 5}"></div>
      </div>
      ${p ? '' : '<div class="field"><label>Quantidade inicial em estoque</label><input type="number" min="0" name="quantidade" value="0"></div>'}
      <div class="field"><label>URL da imagem (opcional)</label><input type="url" name="imagem_url" placeholder="https://..." value="${esc(p?.imagem_url)}"></div>
      <label style="display:flex;gap:8px;align-items:center;cursor:pointer;color:var(--text)"><input type="checkbox" name="ativo" style="width:auto" ${!p || p.ativo ? 'checked' : ''}> Exibir na loja</label>
      ${p ? '<p class="muted" style="font-size:13px;margin-top:10px">Para alterar a quantidade, use o botão Movimentar (assim fica registrado no histórico).</p>' : ''}
      <div class="actions"><button type="button" class="btn ghost" data-a="close">Cancelar</button><button class="btn">Salvar</button></div>
    </form>`);
}

function movForm(id) {
  const p = state.adm.produtos.find(x => x.id === id); if (!p) return;
  openModal(`
    <h2>Movimentar estoque</h2>
    <p style="margin-bottom:14px"><b>${esc(p.nome)}</b><br><span class="muted">Estoque atual: ${p.quantidade} un.</span></p>
    <form data-f="mov" data-id="${p.id}">
      <div class="row">
        <div class="field"><label>Tipo</label><select name="tipo"><option value="entrada">Entrada (+)</option><option value="saida">Saída (−)</option><option value="ajuste">Ajuste (definir total)</option></select></div>
        <div class="field"><label>Quantidade</label><input type="number" name="qtd" min="0" required value="1"></div>
      </div>
      <div class="field"><label>Motivo</label><input name="motivo" placeholder="Ex: compra de fornecedor, uso na oficina, inventário"></div>
      <div class="actions"><button type="button" class="btn ghost" data-a="close">Cancelar</button><button class="btn">Registrar</button></div>
    </form>`);
}

/* ============================================================
   AÇÕES (cliques)
   ============================================================ */
const actions = {
  close: closeModal,
  openCart, closeCart,
  cat: id => { state.cat = id; drawChips(); drawGrid(); },
  addCart: id => { addCart(id); },
  inc: id => changeQty(id, 1),
  dec: id => changeQty(id, -1),
  checkout,
  copySql: () => navigator.clipboard.writeText(SETUP_SQL).then(() => toast('SQL copiado!', 'ok')).catch(() => toast('Selecione o texto e copie manualmente', 'err')),
  resetConfig: (_i, _el, e) => { e.preventDefault(); if (confirm('Remover a configuração salva do Supabase neste navegador?')) { localStorage.removeItem('op_url'); localStorage.removeItem('op_key'); location.reload(); } },
  logout: () => run(async () => { await sb.auth.signOut(); toast('Você saiu', 'ok'); }),
  tab: id => { state.tab = id; drawAdmin(); },
  newProd: () => prodForm(),
  editProd: id => prodForm(state.adm.produtos.find(p => p.id === id)),
  mov: id => movForm(id),
  sample: () => run(async () => {
    if (!confirm('Adicionar os produtos de exemplo? Os que já existem (mesmo código) não serão alterados.')) return;
    const { data, error } = await sb.from('produtos').upsert(SAMPLE_PRODUCTS, { onConflict: 'sku', ignoreDuplicates: true }).select();
    if (error) throw error;
    const novos = data || [];
    const movs = novos.filter(p => p.quantidade > 0).map(p => ({ produto_id: p.id, tipo: 'entrada', quantidade: p.quantidade, motivo: 'Estoque inicial' }));
    if (movs.length) await sb.from('movimentacoes').insert(movs);
    toast(novos.length ? novos.length + ' produtos adicionados' : 'Todos os produtos de exemplo já estavam cadastrados', 'ok');
    await loadAdmin(); drawAdmin();
  }),
  delProd: id => run(async () => {
    const p = state.adm.produtos.find(x => x.id === id);
    if (!confirm(`Excluir "${p.nome}"? O histórico de movimentações dele também será apagado.\n(Dica: desmarque "Exibir na loja" para apenas ocultar.)`)) return;
    const { error } = await sb.from('produtos').delete().eq('id', id); if (error) throw error;
    toast('Produto excluído', 'ok'); await loadAdmin(); drawAdmin();
  }),
  cancelOrder: id => run(async () => {
    if (!confirm('Cancelar este pedido e devolver os itens ao estoque?')) return;
    const { error } = await sb.rpc('cancelar_pedido', { p_id: id }); if (error) throw error;
    toast('Pedido cancelado e estoque restaurado', 'ok'); await loadAdmin(); drawAdmin();
  }),
  csv: () => {
    const head = ['SKU','Nome','Categoria','Custo','Preco','Quantidade','Estoque minimo','Ativo'];
    const rows = state.adm.produtos.map(p => [p.sku, p.nome, p.categoria, p.custo, p.preco, p.quantidade, p.estoque_minimo, p.ativo ? 'sim' : 'nao']);
    const csv = [head, ...rows].map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(';')).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' }));
    a.download = 'estoque-' + new Date().toISOString().slice(0, 10) + '.csv'; a.click();
  }
};

document.addEventListener('click', e => {
  if (e.target.classList.contains('backdrop')) return closeModal();
  const el = e.target.closest('[data-a]'); if (!el) return;
  const fn = actions[el.dataset.a]; if (fn) fn(el.dataset.id, el, e);
});

/* ============================================================
   FORMULÁRIOS
   ============================================================ */
const forms = {
  setup: f => {
    const url = f.url.value.trim().replace(/\/$/, ''), key = f.key.value.trim();
    if (!url.startsWith('http')) return toast('URL inválida', 'err');
    localStorage.setItem('op_url', url); localStorage.setItem('op_key', key);
    location.reload();
  },
  login: f => run(async () => {
    const { error } = await sb.auth.signInWithPassword({ email: f.email.value.trim(), password: f.senha.value });
    if (error) throw new Error('E-mail ou senha incorretos');
    toast('Bem-vindo!', 'ok');
  }),
  order: f => run(async () => {
    const nome = f.nome.value.trim().replace(/\s+/g, ' ');
    if (nome.split(' ').length < 2) throw new Error('Digite seu nome completo (nome e sobrenome)');
    const itens = state.cart.map(c => ({ id: c.id, qtd: c.qtd }));
    const resumo = cartItems();
    const total = resumo.reduce((a, i) => a + i.preco * i.qtd, 0);
    // reserva o estoque e registra o pedido no sistema
    const { data, error } = await sb.rpc('criar_pedido', { p_nome: nome, p_tel: 'WhatsApp', p_obs: null, p_itens: itens });
    if (error) { await loadProdutos().catch(() => {}); drawGrid(); throw error; }
    state.cart = []; saveCart();
    await loadProdutos().catch(() => {}); drawChips(); drawGrid();

    const msg = `Olá! Quero fazer o pedido #${data}:\n\n` +
      resumo.map(i => `• ${i.qtd}x ${i.nome} - ${brl(i.preco * i.qtd)}`).join('\n') +
      `\n\n*Total: ${brl(total)}*\nNome: ${nome}`;
    const link = `https://wa.me/${CONFIG.WHATSAPP}?text=${encodeURIComponent(msg)}`;
    openModal(`<h2>Pedido #${data} registrado!</h2>
      <p class="muted">Abrindo o WhatsApp para enviar seu pedido à loja. Se não abrir sozinho, toque no botão abaixo.</p>
      <div class="actions"><button class="btn ghost" data-a="close">Fechar</button><a class="btn wpp" style="text-decoration:none" href="${link}" target="_blank" rel="noopener">Abrir WhatsApp</a></div>`);
    setTimeout(() => { window.location.href = link; }, 800);
  }),
  prod: f => run(async () => {
    const id = f.dataset.id;
    const d = {
      nome: f.nome.value.trim(), sku: f.sku.value.trim() || null, categoria: f.categoria.value.trim() || 'Geral',
      descricao: f.descricao.value.trim() || null, custo: num(f.custo.value), preco: num(f.preco.value),
      estoque_minimo: parseInt(f.estoque_minimo.value) || 0, imagem_url: f.imagem_url.value.trim() || null, ativo: f.ativo.checked
    };
    if (id) {
      const { error } = await sb.from('produtos').update(d).eq('id', id); if (error) throw error;
    } else {
      d.quantidade = Math.max(0, parseInt(f.quantidade.value) || 0);
      const { data, error } = await sb.from('produtos').insert(d).select().single(); if (error) throw error;
      if (d.quantidade > 0) await sb.from('movimentacoes').insert({ produto_id: data.id, tipo: 'entrada', quantidade: d.quantidade, motivo: 'Estoque inicial' });
    }
    closeModal(); toast('Produto salvo', 'ok'); await loadAdmin(); drawAdmin();
  }),
  mov: f => run(async () => {
    const { error } = await sb.rpc('movimentar_estoque', { p_produto: f.dataset.id, p_tipo: f.tipo.value, p_qtd: parseInt(f.qtd.value) || 0, p_motivo: f.motivo.value.trim() || null });
    if (error) throw error;
    closeModal(); toast('Movimentação registrada', 'ok'); await loadAdmin(); drawAdmin();
  })
};
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-f]'); if (!f) return;
  e.preventDefault(); forms[f.dataset.f](f);
});

const inputs = {
  q: v => { state.q = v; drawGrid(); },
  pq: v => { state.pq = v; drawProdTable(); },
  low: (_v, el) => { state.onlyLow = el.checked; drawProdTable(); },
  status: (v, el) => run(async () => {
    const { error } = await sb.from('pedidos').update({ status: v }).eq('id', el.dataset.id); if (error) throw error;
    toast('Status atualizado', 'ok'); await loadAdmin(); drawAdmin();
  })
};
document.addEventListener('input', e => {
  const k = e.target.dataset.i; if (k && ['q','pq'].includes(k)) inputs[k](e.target.value);
});
document.addEventListener('change', e => {
  const k = e.target.dataset.i; if (k && ['low','status'].includes(k)) inputs[k](e.target.value, e.target);
});

init();
</script>
</body>
</html>
